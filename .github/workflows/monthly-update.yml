name: Monthly Dashboard Update

on:
  schedule:
    # 매월 15일 KST 03:00 (UTC 18:00 of the 14th)
    - cron: '0 18 14 * *'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Fetch data from 환경부 API
        env:
          MOE_API_KEY: ${{ secrets.MOE_API_KEY }}
        run: python scripts/fetch_api.py

      - name: Fetch EV registration data
        env:
          EV_REG_API_KEY: ${{ secrets.EV_REG_API_KEY }}
        run: python scripts/fetch_ev_registration.py

      - name: Transform raw → monthly snapshot
        run: python scripts/transform.py

      - name: Build dashboard data
        run: python scripts/build_dashboard_data.py

      - name: Build charger deployment report (섹션⑥)
        run: python scripts/build_charger_deployment.py

      - name: Setup Node.js (EV Sales Dashboard)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 다나와 판매실적(전월) 수집. 외부 API키 불필요. 다나와가 CI IP를 막아도
      # 워크플로가 실패하지 않도록 non-blocking — 실패 시 기존 ev_master.csv 로 재빌드.
      - name: Collect Danawa EV model sales (전월)
        continue-on-error: true
        run: node ev_sales/scripts/collect_models.mjs

      - name: Build EV Sales Dashboard
        run: node ev_sales/scripts/build_sk_dashboard.mjs

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ ev_sales/data/ev_master.csv "EV Sales Dashboard.html"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            MONTH=$(date -u -d '1 hour' +'%Y-%m')
            git commit -m "chore: monthly data update ($MONTH)"
            git push
          fi
