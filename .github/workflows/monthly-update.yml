name: Monthly Dashboard Update

on:
  schedule:
    # 매월 15일 KST 03:00 (UTC 18:00 of the 14th)
    - cron: '0 18 14 * *'
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      skip_ev:
        description: 'EV Sales job 건너뛰기 (환경부 장애 시 AEP만 재시도할 때 true)'
        default: 'false'

# 같은 워크플로의 동시 실행을 막아 main push 경쟁을 방지 (큐잉, 취소 안 함)
concurrency:
  group: monthly-update
  cancel-in-progress: false

jobs:
  # ── AEP (환경부 충전기/등록 · Python 파이프라인) ──────────────────────────
  update-aep:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 충전기(환경부)·차량(KOTSA)은 서로 독립 소스 → 각각 continue-on-error 로 분리.
      # 한쪽 API 장애가 다른 쪽 수집·빌드를 막지 않게 한다(과거엔 앞 스텝 실패 시 전부 skip 됐음).
      - name: Fetch data from 환경부 API (충전기)
        id: charger
        continue-on-error: true
        env:
          MOE_API_KEY: ${{ secrets.MOE_API_KEY }}
        run: python scripts/fetch_api.py

      - name: Fetch EV registration data (차량 · KOTSA)
        id: vehicle
        continue-on-error: true
        env:
          EV_REG_API_KEY: ${{ secrets.EV_REG_API_KEY }}
        run: python scripts/fetch_ev_registration.py

      # transform 은 충전기 raw 를 월 스냅샷으로 변환 — 충전기 성공 시에만.
      # (실패 시 돌리면 지난달 raw 를 이번 달로 잘못 라벨링해 오염됨)
      - name: Transform raw → monthly snapshot (충전기 성공 시)
        if: steps.charger.outcome == 'success'
        run: python scripts/transform.py

      # build_dashboard_data 는 raw 불필요(monthly/ + ev_registration/ 만 사용).
      # 차량만 성공해도 ev_sales 를 갱신하므로 하나라도 성공하면 실행.
      - name: Build dashboard data (충전기·차량 중 하나라도 성공 시)
        if: steps.charger.outcome == 'success' || steps.vehicle.outcome == 'success'
        run: python scripts/build_dashboard_data.py

      - name: Build charger deployment report (섹션⑥ — 충전기 성공 시)
        if: steps.charger.outcome == 'success'
        run: python scripts/build_charger_deployment.py

      - name: Commit and push (AEP data)
        if: steps.charger.outcome == 'success' || steps.vehicle.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            MONTH=$(date -u -d '1 hour' +'%Y-%m')
            git commit -m "chore: monthly AEP data update ($MONTH)"
            # 30분 수집 도중 main 이 앞서갔을 수 있으니 rebase 후 push
            git pull --rebase origin main
            git push
          fi

      # 성공분은 위에서 이미 커밋됨. 한 소스라도 실패했으면 job 을 빨간불로 표시(가시성).
      - name: 수집 실패 표시 (성공분은 이미 커밋됨)
        if: steps.charger.outcome != 'success' || steps.vehicle.outcome != 'success'
        run: |
          echo "charger=${{ steps.charger.outcome }} / vehicle=${{ steps.vehicle.outcome }}"
          echo "::error::일부 소스 수집 실패 (charger=${{ steps.charger.outcome }}, vehicle=${{ steps.vehicle.outcome }}). 성공한 소스만 갱신·커밋됨. 실패 소스는 백엔드 회복 후 재실행하세요."
          exit 1

  # ── EV Sales (다나와 모델별 판매 · Node 파이프라인) ───────────────────────
  # AEP job 과 독립: 환경부 수집이 실패해도 항상 실행(if: always()).
  # AEP 뒤에 순차 실행 + push 전 rebase 로 main push 경쟁을 피한다.
  update-ev-sales:
    needs: update-aep
    # AEP 실패와 독립(always). 단 skip_ev=true 재시도(AEP 전용)일 땐 건너뜀.
    if: ${{ always() && github.event.inputs.skip_ev != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 다나와 판매실적(전월) 수집. 외부 API키 불필요. 다나와가 CI IP를 막아도
      # 워크플로가 실패하지 않도록 non-blocking — 실패 시 기존 ev_master.csv 로 재빌드.
      - name: Collect Danawa EV model sales (전월)
        continue-on-error: true
        run: node ev_sales/scripts/collect_models.mjs

      - name: Build EV Sales Dashboard
        run: node ev_sales/scripts/build_sk_dashboard.mjs

      - name: Commit and push (EV Sales Dashboard)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ev_sales/data/ev_master.csv "EV Sales Dashboard.html"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            MONTH=$(date -u -d '1 hour' +'%Y-%m')
            git commit -m "chore: EV sales dashboard update ($MONTH)"
            # AEP job 이 방금 push 했을 수 있으니 rebase 후 push
            git pull --rebase origin main
            git push
          fi
